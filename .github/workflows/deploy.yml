name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ vars.SITE_BASE || '/statementsheet/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://shubham-thakur282.github.io/statementsheet/' }}
      # Public identifiers only (configure in repo Settings → Secrets and variables → Actions → Variables)
      VITE_LS_STORE_ID: ${{ vars.VITE_LS_STORE_ID }}
      VITE_LS_PRODUCT_IDS: ${{ vars.VITE_LS_PRODUCT_IDS }}
      VITE_LS_CHECKOUT_MONTHLY: ${{ vars.VITE_LS_CHECKOUT_MONTHLY }}
      VITE_LS_CHECKOUT_YEARLY: ${{ vars.VITE_LS_CHECKOUT_YEARLY }}
      VITE_LS_PORTAL_URL: ${{ vars.VITE_LS_PORTAL_URL }}
      VITE_GOATCOUNTER_CODE: ${{ vars.VITE_GOATCOUNTER_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          env -u SITE_BASE -u SITE_URL npx playwright test
      - name: Production build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
